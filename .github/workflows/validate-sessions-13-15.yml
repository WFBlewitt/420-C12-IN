name: Validate Sessions 13-15

on:
  pull_request:
    paths:
      - "docs/fr/seances/seance-1[3-5].md"
      - "docs/fr/laboratoires/laboratoire-1[3-5].md"
      - "docs/en/sessions/session-1[3-5].md"
      - "docs/en/labs/lab-1[3-5].md"
      - "docs/assets/images/session-1[3-5]-*.svg"
      - "docs/fr/seances/index.md"
      - "docs/fr/laboratoires/index.md"
      - "docs/en/sessions/index.md"
      - "docs/en/labs/index.md"
      - "mkdocs.yml"
      - ".github/workflows/validate-sessions-13-15.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/generate_meilleurachat_catalogues.py
      - name: Check bilingual structure, interaction, and parity
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          errors = []
          labs = [
              (Path('docs/fr/laboratoires/laboratoire-13.md'), Path('docs/en/labs/lab-13.md')),
              (Path('docs/fr/laboratoires/laboratoire-14.md'), Path('docs/en/labs/lab-14.md')),
              (Path('docs/fr/laboratoires/laboratoire-15.md'), Path('docs/en/labs/lab-15.md')),
          ]
          for fr, en in labs:
              for page in (fr, en):
                  text = page.read_text(encoding='utf-8')
                  if text.count('data-lab-task-check') != 11:
                      errors.append(f'{page}: expected 11 required tasks')
                  if text.count('data-lab-gate-check') != 3:
                      errors.append(f'{page}: expected 3 conduct commitments')
                  for token in ['data-lab-checklist', 'data-lab-unlock', 'data-lab-content',
                                'data-lab-reset', 'data-lab-gate-status', '<noscript>', 'max="11"']:
                      if token not in text:
                          errors.append(f'{page}: missing {token}')
                  if text.count('```') % 2:
                      errors.append(f'{page}: unbalanced fenced code')
                  if 'Priority pathway' not in text and 'Parcours prioritaire' not in text:
                      errors.append(f'{page}: missing priority pathway')
                  if 'Required consolidation' not in text and 'Consolidation exigée' not in text:
                      errors.append(f'{page}: missing required consolidation')
                  if 'data-lab-supplement' not in text:
                      errors.append(f'{page}: missing optional supplement container')
              if fr.read_text(encoding='utf-8').count('data-lab-task-check') != en.read_text(encoding='utf-8').count('data-lab-task-check'):
                  errors.append(f'{fr}/{en}: task-count parity failure')

          sessions = [
              (Path('docs/fr/seances/seance-13.md'), Path('docs/en/sessions/session-13.md')),
              (Path('docs/fr/seances/seance-14.md'), Path('docs/en/sessions/session-14.md')),
              (Path('docs/fr/seances/seance-15.md'), Path('docs/en/sessions/session-15.md')),
          ]
          fr_headings = ['## But de la séance','## Objectifs','## Synthèse intégrée',
                         '## Erreurs fréquentes à éviter',"## Ce qu'il faut retenir",'## Passer à la pratique']
          en_headings = ['## Purpose of the session','## Objectives','## Integrated synthesis',
                         '## Common errors to avoid','## What to remember','## Put it into practice']
          for fr, en in sessions:
              ft, et = fr.read_text(encoding='utf-8'), en.read_text(encoding='utf-8')
              for h in fr_headings:
                  if h not in ft: errors.append(f'{fr}: missing {h}')
              for h in en_headings:
                  if h not in et: errors.append(f'{en}: missing {h}')
              if ft.count('```') % 2 or et.count('```') % 2:
                  errors.append(f'{fr}/{en}: unbalanced fenced code')
              fr_checks = ft.count('??? question') + ft.count('!!! question')
              en_checks = et.count('??? question') + et.count('!!! question')
              if fr_checks < 2 or en_checks < 2:
                  errors.append(f'{fr}/{en}: insufficient embedded checks')

          forbidden = {
              Path('docs/fr/laboratoires/laboratoire-14.md'): ['<passerelle', '<nom-', '<destination-'],
              Path('docs/en/labs/lab-14.md'): ['<approved-', '<name-', '<destination-'],
          }
          for page, tokens in forbidden.items():
              text = page.read_text(encoding='utf-8')
              for token in tokens:
                  if token in text: errors.append(f'{page}: unsafe copyable placeholder {token}')

          for svg in Path('docs/assets/images').glob('session-1[3-5]-*.svg'):
              try:
                  ET.fromstring(svg.read_text(encoding='utf-8'))
                  txt = svg.read_text(encoding='utf-8')
                  for marker in ['role="img"', '<title', '<desc']:
                      if marker not in txt: errors.append(f'{svg}: missing {marker}')
              except ET.ParseError as exc:
                  errors.append(f'{svg}: invalid XML: {exc}')

          nav = Path('mkdocs.yml').read_text(encoding='utf-8')
          for n in (13, 14, 15):
              for path in [f'fr/seances/seance-{n}.md', f'fr/laboratoires/laboratoire-{n}.md',
                           f'en/sessions/session-{n}.md', f'en/labs/lab-{n}.md']:
                  if path not in nav: errors.append(f'mkdocs.yml: missing {path}')

          if errors:
              raise SystemExit('\n'.join(errors))
          print('Sessions and Labs 13-15 checks passed.')
          PY
      - name: Build site strictly
        run: mkdocs build --strict
