site_name: 420-C12-IN - Outils et matériels informatiques
site_url: https://wfblewitt.github.io/420-C12-IN/
site_description: Course materials for 420-C12-IN
site_author: Will Blewitt
copyright: Copyright &copy; 2026 W. Blewitt

draft_docs: |
  drafts/visibility-test.md

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Activer le mode sombre
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Activer le mode clair
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.integrate
    - navigation.top
    - content.code.copy

