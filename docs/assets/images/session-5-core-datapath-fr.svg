<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Chemin de données simplifié dans un cœur</title><desc id="desc">Deux registres fournissent des opérandes à l'UAL, qui produit un résultat vers un registre.</desc><style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:28px;font-weight:700}.t{font-size:22px}.b{fill:#f7f9fa;stroke:#355c7d;stroke-width:2}.a{stroke:#355c7d;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#355c7d"/></marker></defs><text x="40" y="45" class="h">Un calcul : registres → UAL → résultat</text><rect class="b" x="70" y="125" width="220" height="90" rx="12"/><text x="115" y="178" class="t">Registre A</text><rect class="b" x="70" y="260" width="220" height="90" rx="12"/><text x="115" y="313" class="t">Registre B</text><rect class="b" x="390" y="190" width="220" height="100" rx="12"/><text x="475" y="250" class="h">UAL</text><rect class="b" x="710" y="190" width="220" height="100" rx="12"/><text x="750" y="248" class="t">Registre résultat</text><line class="a" x1="290" y1="170" x2="390" y2="220"/><line class="a" x1="290" y1="305" x2="390" y2="260"/><line class="a" x1="610" y1="240" x2="710" y2="240"/><text x="350" y="365" class="t">La largeur fixe détermine quels résultats peuvent être représentés.</text></svg>