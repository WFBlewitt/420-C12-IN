<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Endianness and byte order</title><desc id="desc">Four bytes at addresses 1000 to 1003 are interpreted as little-endian and big-endian values.</desc>
<style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:28px;font-weight:700}.t{font-size:22px}.s{font-size:18px}.box{fill:#f7f9fa;stroke:#355c7d;stroke-width:2}.arrow{stroke:#355c7d;stroke-width:3;marker-end:url(#a)}.accent{fill:#e8f2f8;stroke:#355c7d;stroke-width:2}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#355c7d"/></marker></defs>
<text x="40" y="45" class="h">Same memory, two interpretations</text>
<text x="40" y="90" class="t">Increasing addresses →</text>
<g transform="translate(210 115)"><rect class="box" x="0" y="0" width="170" height="85"/><rect class="box" x="170" y="0" width="170" height="85"/><rect class="box" x="340" y="0" width="170" height="85"/><rect class="box" x="510" y="0" width="170" height="85"/>
<text x="60" y="32" class="s">0x1000</text><text x="230" y="32" class="s">0x1001</text><text x="400" y="32" class="s">0x1002</text><text x="570" y="32" class="s">0x1003</text>
<text x="65" y="68" class="h">78</text><text x="235" y="68" class="h">56</text><text x="405" y="68" class="h">34</text><text x="575" y="68" class="h">12</text></g>
<line class="arrow" x1="340" y1="225" x2="240" y2="290"/><line class="arrow" x1="650" y1="225" x2="760" y2="290"/>
<rect class="accent" x="80" y="295" width="390" height="90" rx="12"/><text x="105" y="330" class="t">Little-endian</text><text x="105" y="365" class="h">0x12345678</text>
<rect class="accent" x="530" y="295" width="390" height="90" rx="12"/><text x="555" y="330" class="t">Big-endian</text><text x="555" y="365" class="h">0x78563412</text>
</svg>