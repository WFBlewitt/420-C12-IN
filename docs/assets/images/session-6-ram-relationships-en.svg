<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Evaluating RAM: different questions require different evidence</title>
  <desc id="desc">Five independent criteria—form, channel organization, transfer rate, latency, and compatibility—connect to a central RAM-evaluation node. The lines show that each criterion contributes evidence; they do not imply that one criterion causes another.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#17202a}
    .h{font-size:27px;font-weight:700}
    .t{font-size:20px}
    .s{font-size:17px}
    .b{fill:#f7f9fa;stroke:#355c7d;stroke-width:2}
    .c{fill:#eaf2f8;stroke:#355c7d;stroke-width:3}
    .l{stroke:#355c7d;stroke-width:4;fill:none}
  </style>
  <text x="40" y="43" class="h">Evaluating RAM: different questions require different evidence</text>

  <rect class="b" x="55" y="105" width="250" height="105" rx="12"/>
  <text x="180" y="145" text-anchor="middle" class="h">Form</text>
  <text x="180" y="180" text-anchor="middle" class="t">DIMM, SO-DIMM, CAMM2...</text>

  <rect class="b" x="425" y="85" width="250" height="125" rx="12"/>
  <text x="550" y="125" text-anchor="middle" class="h">Channels</text>
  <text x="550" y="160" text-anchor="middle" class="t">population and</text>
  <text x="550" y="188" text-anchor="middle" class="t">memory controller</text>

  <rect class="b" x="795" y="105" width="250" height="105" rx="12"/>
  <text x="920" y="145" text-anchor="middle" class="h">Transfer rate</text>
  <text x="920" y="180" text-anchor="middle" class="t">MT/s and data-path width</text>

  <rect class="c" x="390" y="265" width="320" height="110" rx="18"/>
  <text x="550" y="313" text-anchor="middle" class="h">RAM evaluation</text>
  <text x="550" y="345" text-anchor="middle" class="s">requirement + evidence + platform</text>

  <rect class="b" x="150" y="440" width="280" height="105" rx="12"/>
  <text x="290" y="480" text-anchor="middle" class="h">Latency</text>
  <text x="290" y="515" text-anchor="middle" class="t">time before useful data</text>

  <rect class="b" x="670" y="440" width="280" height="105" rx="12"/>
  <text x="810" y="480" text-anchor="middle" class="h">Compatibility</text>
  <text x="810" y="512" text-anchor="middle" class="t">CPU + board + module + firmware</text>

  <line class="l" x1="285" y1="210" x2="430" y2="280"/>
  <line class="l" x1="550" y1="210" x2="550" y2="265"/>
  <line class="l" x1="815" y1="210" x2="670" y2="280"/>
  <line class="l" x1="430" y1="475" x2="480" y2="375"/>
  <line class="l" x1="670" y1="475" x2="620" y2="375"/>

  <text x="75" y="592" class="s">The lines group evaluation criteria; they do not show causal relationships between the criteria.</text>
</svg>
