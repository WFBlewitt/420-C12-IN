<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">Simplified media chain</title><desc id="desc">Content passes through the application, graphics or audio processing, the interface, and then the display or speakers.</desc><style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:27px;font-weight:700}.t{font-size:19px}.b{fill:#f7f9fa;stroke:#355c7d;stroke-width:2}.a{stroke:#355c7d;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#355c7d"/></marker></defs><text x="35" y="42" class="h">A media chain: every link can impose a limit</text><rect class="b" x="35" y="120" width="175" height="100" rx="12"/><text x="75" y="160" class="t">File, game,</text><text x="78" y="190" class="t">or capture</text><rect class="b" x="255" y="120" width="175" height="100" rx="12"/><text x="295" y="175" class="t">Application</text><rect class="b" x="475" y="120" width="190" height="100" rx="12"/><text x="515" y="160" class="t">GPU / codec</text><text x="518" y="190" class="t">/ processing</text><rect class="b" x="710" y="120" width="175" height="100" rx="12"/><text x="752" y="160" class="t">Interface</text><text x="755" y="190" class="t">and cable</text><rect class="b" x="930" y="120" width="140" height="100" rx="12"/><text x="948" y="160" class="t">Display or</text><text x="960" y="190" class="t">speakers</text><line class="a" x1="210" y1="170" x2="255" y2="170"/><line class="a" x1="430" y1="170" x2="475" y2="170"/><line class="a" x1="665" y1="170" x2="710" y2="170"/><line class="a" x1="885" y1="170" x2="930" y2="170"/><text x="95" y="290" class="t">Resolution • refresh • colour depth • codec • data rate • latency • accessibility</text><text x="185" y="325" class="t">Useful capability is what the complete chain can actually sustain.</text></svg>