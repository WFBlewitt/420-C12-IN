<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Résolution DNS et connexion au service comme deux échanges distincts</title>
  <desc id="desc">D'abord, l'application ou le résolveur envoie une requête DNS à un serveur DNS, puis le serveur DNS retourne un enregistrement au résolveur. Ensuite, l'application utilise l'adresse retournée pour communiquer avec le service par l'interface locale et, lorsque la destination est distante, une passerelle ou une route.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#173b57"/></marker>
  </defs>
  <rect width="1200" height="540" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#173b57">Un nom de service mène à deux échanges liés</text>
  <g font-family="Arial, sans-serif">
    <rect x="50" y="75" width="1100" height="190" rx="16" fill="#e7f3f8" stroke="#173b57" stroke-width="2"/>
    <text x="80" y="110" font-size="22" font-weight="700" fill="#173b57">A. Résoudre le nom</text>

    <rect x="110" y="145" width="250" height="70" rx="10" fill="#173b57"/>
    <text x="235" y="187" text-anchor="middle" font-size="18" fill="#fff">Application / résolveur</text>
    <rect x="840" y="145" width="250" height="70" rx="10" fill="#2b7a78"/>
    <text x="965" y="187" text-anchor="middle" font-size="18" fill="#fff">Serveur DNS</text>

    <line x1="360" y1="162" x2="840" y2="162" stroke="#173b57" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="600" y="151" text-anchor="middle" font-size="16" fill="#173b57">requête : nom du service</text>

    <line x1="840" y1="202" x2="360" y2="202" stroke="#173b57" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="600" y="230" text-anchor="middle" font-size="16" fill="#173b57">réponse : enregistrement retourné, ex. 203.0.113.20</text>

    <rect x="50" y="300" width="1100" height="190" rx="16" fill="#f7efe0" stroke="#a56a18" stroke-width="2"/>
    <text x="80" y="335" font-size="22" font-weight="700" fill="#173b57">B. Se connecter au service avec l'adresse retournée</text>

    <rect x="75" y="375" width="190" height="65" rx="10" fill="#173b57"/>
    <text x="170" y="414" text-anchor="middle" font-size="18" fill="#fff">Application</text>
    <rect x="345" y="375" width="190" height="65" rx="10" fill="#2b7a78"/>
    <text x="440" y="404" text-anchor="middle" font-size="17" fill="#fff">Interface et</text>
    <text x="440" y="426" text-anchor="middle" font-size="17" fill="#fff">liaison locale</text>
    <rect x="615" y="375" width="190" height="65" rx="10" fill="#a56a18"/>
    <text x="710" y="404" text-anchor="middle" font-size="17" fill="#fff">Passerelle / route</text>
    <text x="710" y="426" text-anchor="middle" font-size="14" fill="#fff">si destination distante</text>
    <rect x="885" y="375" width="230" height="65" rx="10" fill="#6d4d83"/>
    <text x="1000" y="404" text-anchor="middle" font-size="17" fill="#fff">Service à l'adresse</text>
    <text x="1000" y="426" text-anchor="middle" font-size="15" fill="#fff">retournée par DNS</text>

    <line x1="265" y1="407" x2="345" y2="407" stroke="#173b57" stroke-width="4"/>
    <polygon points="345,407 329,398 329,416" fill="#173b57"/>
    <polygon points="265,407 281,398 281,416" fill="#173b57"/>
    <line x1="535" y1="407" x2="615" y2="407" stroke="#173b57" stroke-width="4"/>
    <polygon points="615,407 599,398 599,416" fill="#173b57"/>
    <polygon points="535,407 551,398 551,416" fill="#173b57"/>
    <line x1="805" y1="407" x2="885" y2="407" stroke="#173b57" stroke-width="4"/>
    <polygon points="885,407 869,398 869,416" fill="#173b57"/>
    <polygon points="805,407 821,398 821,416" fill="#173b57"/>
  </g>
</svg>
