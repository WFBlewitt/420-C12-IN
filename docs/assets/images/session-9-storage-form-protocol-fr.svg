<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Format physique et protocole de stockage</title><desc id="desc">Quatre exemples montrent que le format physique ne suffit pas à identifier le protocole : disque 3,5 pouces SATA, SSD 2,5 pouces SATA, M.2 SATA et M.2 NVMe.</desc><style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:27px;font-weight:700}.t{font-size:20px}.b{fill:#f7f9fa;stroke:#355c7d;stroke-width:2}.tag{fill:#e8f2f8;stroke:#355c7d;stroke-width:2}</style><text x="40" y="42" class="h">Le format ne prouve pas le protocole</text><rect class="b" x="55" y="95" width="210" height="170" rx="12"/><text x="95" y="140" class="h">3,5 po</text><text x="78" y="180" class="t">disque dur</text><rect class="tag" x="88" y="210" width="145" height="38" rx="8"/><text x="130" y="237" class="t">SATA</text><rect class="b" x="290" y="95" width="210" height="170" rx="12"/><text x="335" y="140" class="h">2,5 po</text><text x="360" y="180" class="t">SSD</text><rect class="tag" x="323" y="210" width="145" height="38" rx="8"/><text x="365" y="237" class="t">SATA</text><rect class="b" x="525" y="95" width="210" height="170" rx="12"/><text x="585" y="140" class="h">M.2</text><text x="595" y="180" class="t">SSD</text><rect class="tag" x="558" y="210" width="145" height="38" rx="8"/><text x="600" y="237" class="t">SATA</text><rect class="b" x="760" y="95" width="185" height="170" rx="12"/><text x="805" y="140" class="h">M.2</text><text x="815" y="180" class="t">SSD</text><rect class="tag" x="782" y="210" width="140" height="38" rx="8"/><text x="818" y="237" class="t">NVMe</text><text x="75" y="325" class="t">Pour vérifier une solution, séparez :</text><text x="95" y="365" class="t">support → appareil → format → interface → protocole → volume → système de fichiers</text><text x="95" y="420" class="t">M.2 décrit d'abord une forme et un connecteur; NVMe décrit un protocole de stockage.</text></svg>